name: Find Motorola Portov / SM4450 Kernel Headers

on: [workflow_dispatch]

jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - name: Search MotorolaMobilityLLC & CodeLinaro headers
        run: |
          python3 -c '
          import urllib.request, json

          def get_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  return json.loads(r.read().decode())

          print("=== MotorolaMobilityLLC kernel/wlan repos ===")
          repos = get_json("https://github.com")
          for r in repos:
              name = r.get("name", "")
              if any(k in name.lower() for k in ["kernel", "wlan", "qca", "portov", "6.6", "msm", "vendor"]):
                  print(name, "-> default:", r.get("default_branch"), "| updated:", r.get("updated_at"))

          print("=== Search tags/repos for portov or W1VTS or VVTS ===")
          res = get_json("https://github.com")
          for item in res.get("items", []):
              print(item.get("full_name"), "->", item.get("default_branch"))
          '
          
