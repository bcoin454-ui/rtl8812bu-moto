name: Find Motorola Portov / SM4450 Kernel Headers

on: [workflow_dispatch]

jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - name: Check MotorolaMobilityLLC git refs directly
        run: |
          GH="https://github.com"
          ORG="MotorolaMobilityLLC"
          echo "=== kernel-msm refs ==="
          git ls-remote --heads --tags "${GH}/${ORG}/kernel-msm.git" | grep -iE "portov|sm4450|parrot|ravelin|v1vt|w1vt|6\.6" | tail -n 30 || true

          echo "=== kernel-platform refs ==="
          git ls-remote --heads --tags "${GH}/${ORG}/kernel-platform.git" 2>/dev/null | grep -iE "portov|sm4450|parrot|ravelin|v1vt|w1vt|6\.6" | tail -n 30 || true

          echo "=== vendor-qcom-opensource-wlan-qcacld-3.0 refs ==="
          git ls-remote --heads --tags "${GH}/${ORG}/vendor-qcom-opensource-wlan-qcacld-3.0.git" 2>/dev/null | tail -n 20 || true
          
