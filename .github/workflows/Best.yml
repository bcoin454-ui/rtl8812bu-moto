name: Inspect Stock cfg80211.ko Ops Offsets

on: [workflow_dispatch]

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo (cfg80211.ko)
        uses: actions/checkout@v4

      - name: Install LLVM objdump
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 binutils

      - name: Dump cfg80211_ops offsets from stock cfg80211.ko
        run: |
          echo "=== cfg80211_change_iface ==="
          llvm-objdump-18 -d "$GITHUB_WORKSPACE/cfg80211.ko" | awk '/<cfg80211_change_iface>:/{flag=1} flag{print; count++; if(count>40) exit}'
          echo "=== ___cfg80211_scan ==="
          llvm-objdump-18 -d "$GITHUB_WORKSPACE/cfg80211.ko" | awk '/<___cfg80211_scan>:/{flag=1} flag{print; count++; if(count>45) exit}'
          echo "=== cfg80211_netdev_notifier_call ==="
          llvm-objdump-18 -d "$GITHUB_WORKSPACE/cfg80211.ko" | awk '/<cfg80211_netdev_notifier_call>:/{flag=1} flag{print; count++; if(count>65) exit}'
          
