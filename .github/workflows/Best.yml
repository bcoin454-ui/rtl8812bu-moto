name: Find Motorola Portov / SM4450 Kernel Headers

on: [workflow_dispatch]

jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo (cfg80211.ko)
        uses: actions/checkout@v4

      - name: Inspect cfg80211.ko strings & search Motorola/Qualcomm repos
        run: |
          echo "=== Strings from stock cfg80211.ko ==="
          strings "$GITHUB_WORKSPACE/cfg80211.ko" | grep -iE "moto|qcom|portov|parrot|ravelin|sm4450|wlan|version|BUILD" | head -n 30 || true

          echo "=== Search MotorolaMobilityLLC repos on GitHub ==="
          curl -s "https://github.com" | python3 -c '
          import sys, json
          repos = json.load(sys.stdin)
          if isinstance(repos, list):
              for r in repos:
                  name = r.get("name", "")
                  if any(k in name.lower() for k in ["kernel", "wlan", "qca", "portov", "6.6", "msm"]):
                      print(name, "->", r.get("default_branch"), r.get("updated_at"))
          else:
              print(repos)
          '

          echo "=== Search MotorolaMobilityLLC tags/branches for portov / W1VTS / VVTS ==="
          curl -s "https://github.com" | python3 -c '
          import sys, json
          data = json.load(sys.stdin)
          for item in data.get("items", []):
              print(item.get("full_name"), "->", item.get("default_branch"))
          '
          
