name: Build RTL8812BU Driver
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev make git wget curl python3 xz-utils zstd cpio

      - name: Download Clang and Kernel
        run: |
          mkdir -p ~/build && cd ~/build
          HOST="https://android.googlesource.com"
          CLANG_PATH="platform/prebuilts/clang/host/linux-x86"
          KERNEL_PATH="kernel/common"
          git clone --depth=1 "$HOST/$CLANG_PATH" -b main clang-repo
          mv clang-repo/clang-r510928 ./clang && rm -rf clang-repo
          git init kernel && cd kernel
          git remote add origin "$HOST/$KERNEL_PATH"
          git fetch --depth=1 origin c901ea41aa32
          git checkout FETCH_HEAD

      - name: Prepare Kernel
        run: |
          cd ~/build/kernel
          export PATH="$HOME/build/clang/bin:$PATH"
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          scripts/config --set-str LOCALVERSION "-android15-8-gc901ea41aa32-ab15981388-4k"
          scripts/config -d LOCALVERSION_AUTO -m CFG80211 -m MAC80211
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig modules_prepare M=net/wireless modules

      - name: Build Driver
        run: |
          cd ~/build
          GH="https://github.com"
          DRV="morrownr/88x2bu-20210702.git"
          git clone --depth=1 "$GH/$DRV" driver
          cd driver
          sed -i 's/CONFIG_WIFI_MONITOR = n/CONFIG_WIFI_MONITOR = y/' Makefile
          sed -i 's/CONFIG_POWER_SAVING = y/CONFIG_POWER_SAVING = n/' Makefile
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' Makefile
          sed -i 's/CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/' Makefile
          export PATH="$HOME/build/clang/bin:$PATH"
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 KSRC=$HOME/build/kernel KVER="6.6.118-android15-8-gc901ea41aa32-ab15981388-4k"

      - name: Upload File
        uses: actions/upload-artifact@v4
        with:
          name: rtl8812bu-driver
          path: ~/build/driver/88x2bu.ko
