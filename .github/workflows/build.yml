name: Build Native RTW88 (RTL8812BU / RTL8822BU) for GKI

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo (stock_config & cfg80211.ko)
        uses: actions/checkout@v4

      - name: Install tools and Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make git wget curl python3 xz-utils zstd cpio libelf-dev dwarves clang-18 lld-18 llvm-18 kmod binutils
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-18 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-18 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-18 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-strip-18 /usr/bin/llvm-strip
          sudo ln -sf /usr/bin/llvm-objcopy-18 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-18 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-readelf-18 /usr/bin/llvm-readelf

      - name: Cache Built Kernel Base
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: ~/build/kernel
          key: stock-gki-6.6.118-c901ea41aa32-rtw88-v3

      - name: Download & Prepare Kernel Source
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/build/kernel && cd ~/build/kernel
          SUB1="android"
          DOM1="googlesource.com"
          P2="/kernel/common"
          git init
          git remote add origin "https://${SUB1}.${DOM1}${P2}"
          git fetch --depth=100 origin "refs/heads/android15-6.6-2026-07:refs/remotes/origin/july" "+refs/tags/android15-6.6-2026-07_r*:refs/tags/android15-6.6-2026-07_r*"
          FULL_HASH=$(git log --all --format="%H" | grep "^c901ea41aa32" | head -n 1)
          [ -z "$FULL_HASH" ] && FULL_HASH=$(git rev-parse origin/july)
          git checkout "$FULL_HASH"

          cp "$GITHUB_WORKSPACE/stock_config" .config
          scripts/config --disable MODULE_SIG --disable MODULE_SIG_ALL --disable TRIM_UNUSED_KSYMS \
            --set-str SYSTEM_TRUSTED_KEYS "" --set-str SYSTEM_REVOCATION_KEYS "" --set-str UNUSED_KSYMS_WHITELIST "" \
            -e NETDEVICES -e WLAN -e WLAN_VENDOR_REALTEK -e RFKILL -e CFG80211 \
            -m BCD -m CRYPTO_ARC4 -m MAC80211 \
            -m RTW88 -m RTW88_CORE -m RTW88_USB -m RTW88_8822B -m RTW88_8822BU
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          grep -E "RTW88|MAC80211|ARC4|CONFIG_BCD" .config
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 Image modules

      - name: Patch Symvers & Rebuild RTW88 Modules with Real CRC
        run: |
          CFG_KO="$GITHUB_WORKSPACE/cfg80211.ko"
          python3 -c '
          import subprocess, struct, re

          ko = "'"$CFG_KO"'"
          sec_out = subprocess.check_output(["readelf", "-SW", ko], text=True)
          idx_map = {}
          for line in sec_out.splitlines():
              m = re.search(r"\[\s*(\d+)\]\s+(\S+)\s+\S+\s+\S+\s+([0-9a-fA-F]+)", line)
              if m:
                  idx_map[m.group(1)] = (m.group(2), int(m.group(3), 16))

          sym_out = subprocess.check_output(["readelf", "-sW", ko], text=True)
          with open(ko, "rb") as f:
              data = f.read()

          real = {}
          for line in sym_out.splitlines():
              parts = line.split()
              if len(parts) >= 8:
                  sym_full = parts.pop()
                  ndx = parts.pop()
                  if sym_full.startswith("__crc_"):
                      sym_name = sym_full.replace("__crc_", "", 1)
                      val = int(parts.pop(1), 16)
                      if ndx == "ABS":
                          crc = val & 0xffffffff
                      elif ndx in idx_map:
                          sec_name, sec_off = idx_map.get(ndx)
                          chunk = data[sec_off + val : sec_off + val + 4]
                          crc, = struct.unpack("<I", chunk)
                      else:
                          continue
                      real[sym_name] = f"0x{crc:08x}"

          sym_path = "'"$HOME"'/build/kernel/Module.symvers"
          with open(sym_path) as f:
              lines = f.readlines()
          patched = 0
          with open(sym_path, "w") as f:
              for line in lines:
                  cols = line.split("\t")
                  if len(cols) >= 2:
                      s_name = cols.pop(1)
                      old_crc = cols.pop(0)
                      new_crc = real.get(s_name, old_crc)
                      if new_crc != old_crc:
                          patched += 1
                      cols.insert(0, s_name)
                      cols.insert(0, new_crc)
                  f.write("\t".join(cols))
          print("Patched Module.symvers entries:", patched)
          '

          cd ~/build/kernel
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 M=lib modules || true
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 M=crypto modules || true
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 M=net/mac80211 modules || true
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 M=drivers/net/wireless/realtek/rtw88 modules

      - name: Collect Modules & Download Firmware
        run: |
          mkdir -p ~/build/out/firmware/rtw88
          cp ~/build/kernel/lib/bcd.ko ~/build/out/ 2>/dev/null || true
          cp ~/build/kernel/crypto/arc4.ko ~/build/out/ 2>/dev/null || true
          cp ~/build/kernel/net/mac80211/mac80211.ko ~/build/out/ 2>/dev/null || true
          cp ~/build/kernel/drivers/net/wireless/realtek/rtw88/rtw88_core.ko ~/build/out/
          cp ~/build/kernel/drivers/net/wireless/realtek/rtw88/rtw88_usb.ko ~/build/out/
          cp ~/build/kernel/drivers/net/wireless/realtek/rtw88/rtw88_8822b.ko ~/build/out/
          cp ~/build/kernel/drivers/net/wireless/realtek/rtw88/rtw88_8822bu.ko ~/build/out/

          FW_HOST="git.kernel.org"
          FW_PATH="/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtw88/rtw8822b_fw.bin"
          curl -fL -o ~/build/out/firmware/rtw88/rtw8822b_fw.bin "https://${FW_HOST}${FW_PATH}"
          ls -lh ~/build/out/firmware/rtw88/rtw8822b_fw.bin

      - name: Upload Driver & Firmware Bundle
        uses: actions/upload-artifact@v4
        with:
          name: rtw88-gki-bundle
          path: ~/build/out/
          
