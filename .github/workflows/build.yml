name: Build RTL8812BU with Stock Config (Fixed Keys)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo (to get stock_config)
        uses: actions/checkout@v4

      - name: Install tools and Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make git wget curl python3 xz-utils zstd cpio libelf-dev dwarves clang-18 lld-18 llvm-18
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-18 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-18 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-18 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-strip-18 /usr/bin/llvm-strip
          sudo ln -sf /usr/bin/llvm-objcopy-18 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-18 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-readelf-18 /usr/bin/llvm-readelf

      - name: Cache Built Kernel
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: ~/build/kernel
          key: stock-gki-6.6.118-c901ea41aa32-v4

      - name: Download & Build Kernel with Stock Config
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/build/kernel && cd ~/build/kernel
          SUB1="android"
          DOM1="googlesource.com"
          P2="/kernel/common"
          git init
          git remote add origin "https://${SUB1}.${DOM1}${P2}"
          git fetch --depth=100 origin "refs/heads/android15-6.6-2026-07:refs/remotes/origin/july" "+refs/tags/android15-6.6-2026-07_r*:refs/tags/android15-6.6-2026-07_r*"
          FULL_HASH=$(git log --all --format="%H" | grep "^c901ea41aa32" | head -n 1)
          if [ -z "$FULL_HASH" ]; then
            FULL_HASH=$(git rev-parse origin/july)
          fi
          echo "Checking out: $FULL_HASH"
          git checkout "$FULL_HASH"

          cp "$GITHUB_WORKSPACE/stock_config" .config
          # Убираем привязку к приватным сертификатам Google/Motorola, вызывающую ошибку сборки
          scripts/config --disable MODULE_SIG --disable MODULE_SIG_ALL --set-str SYSTEM_TRUSTED_KEYS "" --set-str SYSTEM_REVOCATION_KEYS ""
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 Image modules

      - name: Build Driver
        run: |
          rm -rf ~/build/driver && mkdir -p ~/build && cd ~/build
          DOM3="github.com"
          P4="/morrownr/88x2bu-20210702.git"
          git clone --depth=1 "https://${DOM3}${P4}" driver
          cd driver

          sed -i 's/CONFIG_WIFI_MONITOR = n/CONFIG_WIFI_MONITOR = y/' Makefile
          sed -i 's/CONFIG_POWER_SAVING = y/CONFIG_POWER_SAVING = n/' Makefile
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' Makefile
          sed -i 's/CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/' Makefile
          sed -i 's/-Wno-stringop-overread//g' Makefile

          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            KSRC=$HOME/build/kernel \
            KVER="6.6.118-android15-8-gc901ea41aa32-ab15981388-4k"

      - name: Upload Driver
        uses: actions/upload-artifact@v4
        with:
          name: rtl8812bu-stock-config
          path: ~/build/driver/88x2bu.ko
          
