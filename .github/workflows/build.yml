name: Build 88x2bu WEXT Mode (No cfg80211 Panic)

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo (stock_config)
        uses: actions/checkout@v4

      - name: Install tools and Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make git wget curl python3 xz-utils zstd cpio libelf-dev dwarves clang-18 lld-18 llvm-18 kmod binutils
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-18 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-18 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-18 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-strip-18 /usr/bin/llvm-strip
          sudo ln -sf /usr/bin/llvm-objcopy-18 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-18 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-readelf-18 /usr/bin/llvm-readelf

      - name: Cache Built Kernel Base
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: ~/build/kernel
          key: stock-gki-6.6.118-c901ea41aa32-88x2bu-v3

      - name: Download & Prepare Kernel Source
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/build/kernel && cd ~/build/kernel
          SUB1="android"
          DOM1="googlesource.com"
          P2="/kernel/common"
          git init
          git remote add origin "https://${SUB1}.${DOM1}${P2}"
          git fetch --depth=1 origin "refs/tags/android15-6.6.118_r00:refs/tags/android15-6.6.118_r00"
          git checkout "android15-6.6.118_r00"

          printf '#!/bin/sh\necho "-android15-8-gc901ea41aa32-ab15981388-4k"\n' > scripts/setlocalversion
          chmod +x scripts/setlocalversion

          cp "$GITHUB_WORKSPACE/stock_config" .config
          scripts/config --disable MODULE_SIG --disable MODULE_SIG_ALL --disable TRIM_UNUSED_KSYMS --disable WERROR --disable LOCALVERSION_AUTO \
            --set-str SYSTEM_TRUSTED_KEYS "" --set-str SYSTEM_REVOCATION_KEYS "" --set-str UNUSED_KSYMS_WHITELIST "" \
            --set-str LOCALVERSION "" \
            -e RFKILL -e CFG80211
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 Image modules

      - name: Clone, Disable cfg80211 Everywhere & Build 88x2bu Driver
        run: |
          rm -rf ~/build/driver
          GH_HOST="https://github.com"
          GH_REPO="morrownr/88x2bu-20210702.git"
          git clone --depth=1 "${GH_HOST}/${GH_REPO}" ~/build/driver
          cd ~/build/driver

          sed -i 's/CONFIG_POWER_SAVING = y/CONFIG_POWER_SAVING = n/g' Makefile
          sed -i 's/CONFIG_WIFI_MONITOR = n/CONFIG_WIFI_MONITOR = y/g' Makefile
          sed -i 's/CONFIG_CONCURRENT_MODE = y/CONFIG_CONCURRENT_MODE = n/g' Makefile
          sed -i 's/CONFIG_RTW_DEBUG = y/CONFIG_RTW_DEBUG = n/g' Makefile
          sed -i 's/CONFIG_IOCTL_CFG80211 = y/CONFIG_IOCTL_CFG80211 = n/g' Makefile
          sed -i 's/-Wno-stringop-overread/-Wno-unknown-warning-option/g' Makefile
          sed -i 's/-Werror//g' Makefile

          sed -i 's/#define CONFIG_IOCTL_CFG80211/\/\/ #define CONFIG_IOCTL_CFG80211/g' include/autoconf.h
          sed -i 's/#define RTW_USE_CFG80211_STA_EVENT/\/\/ #define RTW_USE_CFG80211_STA_EVENT/g' include/autoconf.h

          python3 -c '
          p2 = "os_dep/osdep_service.c"
          with open(p2) as f:
              c2 = f.read()
          c2 = c2.replace("filp_open(", "ERR_PTR(-ENOENT); // filp_open(")
          c2 = c2.replace("kernel_read(", "-EINVAL; // kernel_read(")
          c2 = c2.replace("kernel_write(", "-EINVAL; // kernel_write(")
          with open(p2, "w") as f:
              f.write(c2)
          '

          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 KSRC=~/build/kernel KCFLAGS="-Wno-error -Wno-unknown-warning-option" modules
          llvm-nm -u ~/build/driver/88x2bu.ko | grep "wiphy_" && exit 1 || echo "Verified: 0 cfg80211 symbols!"

      - name: Upload 88x2bu.ko
        uses: actions/upload-artifact@v4
        with:
          name: rtl88x2bu-wext-gki
          path: ~/build/driver/88x2bu.ko
          
