name: Build RTL8812BU GKI Compatible (Clean Macro Stubs)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo (stock_config & cfg80211.ko)
        uses: actions/checkout@v4

      - name: Install tools and Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make git wget curl python3 xz-utils zstd cpio libelf-dev dwarves clang-18 lld-18 llvm-18 kmod
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-18 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-18 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-18 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-strip-18 /usr/bin/llvm-strip
          sudo ln -sf /usr/bin/llvm-objcopy-18 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-18 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-readelf-18 /usr/bin/llvm-readelf

      - name: Cache Built Kernel
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: ~/build/kernel
          key: stock-gki-6.6.118-c901ea41aa32-v6

      - name: Download & Build Kernel with Stock Config
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/build/kernel && cd ~/build/kernel
          SUB1="android"
          DOM1="googlesource.com"
          P2="/kernel/common"
          git init
          git remote add origin "https://${SUB1}.${DOM1}${P2}"
          git fetch --depth=100 origin "refs/heads/android15-6.6-2026-07:refs/remotes/origin/july" "+refs/tags/android15-6.6-2026-07_r*:refs/tags/android15-6.6-2026-07_r*"
          FULL_HASH=$(git log --all --format="%H" | grep "^c901ea41aa32" | head -n 1)
          [ -z "$FULL_HASH" ] && FULL_HASH=$(git rev-parse origin/july)
          git checkout "$FULL_HASH"

          cp "$GITHUB_WORKSPACE/stock_config" .config
          scripts/config --disable MODULE_SIG --disable MODULE_SIG_ALL --disable TRIM_UNUSED_KSYMS --set-str SYSTEM_TRUSTED_KEYS "" --set-str SYSTEM_REVOCATION_KEYS "" --set-str UNUSED_KSYMS_WHITELIST "" -e RFKILL -e CFG80211 -e MAC80211
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 Image modules

      - name: Patch Symvers from Phone cfg80211.ko & Build Driver
        run: |
          # 1. Подменяем CRC символов в Module.symvers на реальные значения из cfg80211.ko телефона
          CFG_KO=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -name "cfg80211.ko" | head -n 1)
          echo "Found cfg80211.ko: $CFG_KO"
          if [ -n "$CFG_KO" ]; then
            modprobe --dump-modversions "$CFG_KO" > /tmp/real_crc.txt
            python3 -c '
          real = {}
          with open("/tmp/real_crc.txt") as f:
              for line in f:
                  parts = line.strip().split()
                  if len(parts) == 2:
                      real[parts[1]] = parts[0].lower()
          sym_path = "'"$HOME"'/build/kernel/Module.symvers"
          with open(sym_path) as f:
              lines = f.readlines()
          patched = 0
          with open(sym_path, "w") as f:
              for line in lines:
                  cols = line.split("\t")
                  if len(cols) >= 2 and cols[1] in real:
                      cols[0] = real[cols[1]]
                      patched += 1
                  f.write("\t".join(cols))
          print("Patched symbols count:", patched)
          '
            grep "wiphy_new_nm" "$HOME/build/kernel/Module.symvers" || true
          fi

          # 2. Скачиваем драйвер и переопределяем filp_open / kernel_read / kernel_write через макросы
          rm -rf ~/build/driver && mkdir -p ~/build && cd ~/build
          DOM3="github.com"
          P4="/morrownr/88x2bu-20210702.git"
          git clone --depth=1 "https://${DOM3}${P4}" driver
          cd driver

          cat << 'EOF' >> include/osdep_service_linux.h

          #undef filp_open
          #define filp_open(p, f, m) ERR_PTR(-ENOENT)
          #undef kernel_read
          #define kernel_read(f, b, c, p) (-EPERM)
          #undef kernel_write
          #define kernel_write(f, b, c, p) (-EPERM)
          EOF

          sed -i 's/CONFIG_WIFI_MONITOR = n/CONFIG_WIFI_MONITOR = y/' Makefile
          sed -i 's/CONFIG_POWER_SAVING = y/CONFIG_POWER_SAVING = n/' Makefile
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' Makefile
          sed -i 's/CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/' Makefile
          sed -i 's/-Wno-stringop-overread//g' Makefile

          make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            KSRC=$HOME/build/kernel \
            KVER="6.6.118-android15-8-gc901ea41aa32-ab15981388-4k"

      - name: Upload Driver
        uses: actions/upload-artifact@v4
        with:
          name: rtl8812bu-gki-ready
          path: ~/build/driver/88x2bu.ko
          
