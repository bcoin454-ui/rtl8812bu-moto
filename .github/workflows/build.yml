name: Build RTL8812BU for Moto G67 Power 5G

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make git wget curl python3 xz-utils zstd cpio

      - name: Download GKI Kernel & Clang Toolchain
        run: |
          mkdir -p ~/kernel_build && cd ~/kernel_build
          # Скачиваем Clang r510928 (стандартный тулчейн для android15-6.6)
          git clone --depth=1 https://googlesource.com -b main clang-repo
          mv clang-repo/clang-r510928 ./clang
          rm -rf clang-repo

          # Скачиваем исходники GKI android15-6.6 и переключаемся на коммит вашего ядра
          git init kernel
          cd kernel
          git remote add origin https://googlesource.com
          git fetch --depth=1 origin c901ea41aa32
          git checkout FETCH_HEAD

      - name: Prepare Kernel Headers and Symvers
        run: |
          cd ~/kernel_build/kernel
          export PATH="$HOME/kernel_build/clang/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          # Используем стандартный конфиг GKI + включаем cfg80211 как модуль для генерации символов
          make gki_defconfig
          scripts/config --set-str LOCALVERSION "-android15-8-gc901ea41aa32-ab15981388-4k"
          scripts/config -d LOCALVERSION_AUTO
          scripts/config -m CFG80211
          scripts/config -m MAC80211
          make olddefconfig
          make modules_prepare
          # Генерируем базовый Module.symvers для net/wireless
          make M=net/wireless modules

      - name: Clone and Build RTL8812BU Driver (Monitor Mode Enabled)
        run: |
          cd ~/kernel_build
          # Клонируем драйвер с поддержкой современных ядер 6.6 и Monitor Mode
          git clone --depth=1 https://github.com driver
          cd driver

          # Включаем режим мониторинга и выключаем энергосбережение
          sed -i 's/CONFIG_WIFI_MONITOR = n/CONFIG_WIFI_MONITOR = y/' Makefile
          sed -i 's/CONFIG_POWER_SAVING = y/CONFIG_POWER_SAVING = n/' Makefile
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' Makefile
          sed -i 's/CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/' Makefile

          export PATH="$HOME/kernel_build/clang/bin:$PATH"
          make -j$(nproc) \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            KSRC=$HOME/kernel_build/kernel \
            KVER="6.6.118-android15-8-gc901ea41aa32-ab15981388-4k"

      - name: Upload Compiled Module
        uses: actions/upload-artifact@v4
        with:
          name: rtl8812bu-ko-6.6.118
          path: ~/kernel_build/driver/88x2bu.ko
